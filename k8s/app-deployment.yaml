apiVersion: apps/v1
kind: Deployment
metadata:
  name: crea3-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crea3-app
  template:
    metadata:
      labels:
        app: crea3-app
    spec:
      containers:
        - name: crea3
          # Reemplazar "usuario" por su usuario de GitHub (en minúsculas)
          image: ghcr.io/usuario/crea3:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: crea3-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: crea3-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: crea3-secret
                  key: DB_PASS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
